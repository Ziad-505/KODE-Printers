# KODE Printer — deployment stack.
#
# Four services. The shape follows §B18: nothing is exposed except the reverse
# proxy, TLS terminates in front of the application, and PostgreSQL is never
# reachable from outside the compose network.
#
#   caddy    TLS termination and the only published HTTP port
#   app      the API, the queue worker and the device watchers
#   db       PostgreSQL
#   samba    the scan share printers write into (§B18.2, inbound TCP 445)
#
# Start with:  docker compose up -d --build
# Seed with:   docker compose exec app node dist/db/seed.js

name: kode-printer

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kode_printer}
      POSTGRES_USER: ${POSTGRES_USER:-kode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kode} -d ${POSTGRES_DB:-kode_printer}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # A throwaway database for `npm test`, behind a profile so it never starts
  # with the ordinary stack.
  #
  # Separate from `db` on purpose. The integration suite TRUNCATEs every table
  # between tests, and pointing it at the development database — one typo in
  # DATABASE_URL away — would wipe whatever an engineer had set up to look at.
  # A distinct port, distinct credentials and a distinct database name make
  # that mistake impossible rather than merely unlikely.
  #
  # The credentials are fixed and public because the data is disposable and the
  # port is bound to loopback. Nothing here ever holds a real record.
  db-test:
    image: postgres:16-alpine
    profiles: ['test']
    ports:
      - '127.0.0.1:5434:5432'
    environment:
      POSTGRES_DB: kode_printer_test
      POSTGRES_USER: kode_test
      POSTGRES_PASSWORD: kode_test
    # No named volume: a fresh container every time is the point, and it keeps
    # a half-migrated schema from surviving into the next run.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kode_test -d kode_printer_test']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      KODE_DEBUG: 'false'
      DATABASE_URL: postgres://${POSTGRES_USER:-kode}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kode_printer}
      # Quoted: the `:?` message contains a colon-space, which YAML reads as the
      # start of a new mapping key inside an unquoted scalar.
      JWT_SECRET: '${JWT_SECRET:?generate with: openssl rand -base64 48}'
      SECRET_KEY: '${SECRET_KEY:?generate with: openssl rand -base64 48}'
      CORS_ORIGINS: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      PUBLIC_URL: ${PUBLIC_URL}
      # Caddy is the only thing in front of the app, so exactly one proxy hop.
      # Getting this wrong makes every request look like it came from the proxy
      # and one user's typo rate-limits the whole club.
      TRUST_PROXY_HOPS: '1'
      UPLOAD_DIR: /data/uploads
      SCAN_DIR: /data/scans
      TEMPLATE_DIR: /data/templates
      TMP_DIR: /data/tmp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-KODE Printer <printer@kodesportsclub.local>}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      LOG_FORMAT: json
    volumes:
    - uploads:/data/uploads
    - scans:/data/scans
    - templates:/data/templates
    - scans:/data/scans:rw
    - tmp:/data/tmp
    expose:
      - '3000'
    networks:
      - internal
      # The app must reach printers on the club LAN. `host` is not used, because
      # that would also expose the app's own port; a macvlan or a route through
      # the host is configured per site — see docs/RUNBOOK.md.
      - printers
    security_opt:
      - "seccomp:unconfined"
    cap_drop:
      - "ALL"
    cap_add:
      - "SYS_ADMIN"
    logging: &logging
      driver: "json-file"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # An internal CA certificate goes here; see the Caddyfile.
      - ./docker/certs:/certs:ro
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env}
    networks: [internal]
    logging: *logging  # §B18.2 flags inbound SMB from printers as "the exception worth scrutiny".
  # It is required by scan-to-folder and it is the rule most likely to be
  # refused across a VLAN boundary — where it is refused, that site needs a
  # collector with the share local to it (§B11).
  samba:
    image: dperson/samba:latest
    restart: unless-stopped
    ports:
      - '445:445'
    environment:
      TZ: ${TZ:-Africa/Cairo}
    command: >
      -s "scans;/data/scans;yes;no;no;${SCAN_SHARE_USER:-scanner}"
      -u "${SCAN_SHARE_USER:-scanner};${SCAN_SHARE_PASSWORD:?set SCAN_SHARE_PASSWORD in .env}"
      -p
    volumes:
      - scans:/data/scans
    networks:
      - internal
      - printers
    profiles:
      # Not started by default. Bring it up with `--profile scanning` once at
      # least one device is configured for Scan to Network Folder.
      - scanning
    logging: *logging

volumes:
  db-data:
  uploads:
  scans:
  templates:
  tmp:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
  printers:
    driver: bridge
