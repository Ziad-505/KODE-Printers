    <!--
      Fonts are self-hosted, and neither file is vendored in the repository —
      the CSS falls back to the system stack, which is legible but not KODE.
      Drop `figtree-variable.woff2` and `montserrat-variable.woff2` into
      `public/fonts/` and the interface picks them up.

      There is deliberately no `<link rel="preload">` here: preloading a file
      that is usually absent costs a 404 and a console warning on every single
      page load, which is a poor trade for a few milliseconds when it is
      present. `font-display: swap` covers the difference.

      No font CDN either. The CSP is `default-src 'self'` with no external
      hosts, which is deliberate for an internal system: a CDN is an outbound
      dependency on a network that may have no route to the internet, and a
      third-party stylesheet is a script-injection surface.
    -->
